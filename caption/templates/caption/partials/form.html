<form 
    hx-post="{% url 'caption' %}"
    hx-target="#result-container"
    hx-swap="innerHTML"
    id="caption-form"
    class="grid grid-cols-1 lg:grid-cols-2 gap-12"
>
    {% csrf_token %}

    <div class="space-y-8">
        <div>
            <label class="block text-gray-400 text-[11px] font-bold uppercase tracking-widest mb-3">Topic or Description</label>
            <textarea 
                name="topic" 
                class="w-full h-48 bg-input-bg border border-border-dark rounded-2xl p-6 text-gray-200 placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-accent resize-none transition-all"
                placeholder="Describe what your post is about..." required>{{ form.topic.value|default:'' }}</textarea>
        </div>

        <div class="grid grid-cols-2 gap-6">
            <div class="relative custom-dropdown" id="tone-select">
                <label class="block text-gray-400 text-[11px] font-bold uppercase tracking-widest mb-3">Tone of Voice</label>
                <input type="hidden" name="tone" value="Professional">
                <div class="dropdown-trigger w-full bg-input-bg border border-border-dark rounded-full py-4 px-6 text-gray-200 flex justify-between items-center cursor-pointer hover:border-gray-500 transition-all">
                    <span class="selected-label">Professional</span>
                    <i class="fas fa-chevron-down text-[10px] text-gray-500 transition-transform duration-300"></i>
                </div>
                <div class="dropdown-menu absolute z-50 w-full mt-2 bg-[#1e293b] border border-border-dark rounded-2xl overflow-hidden shadow-2xl">
                    <div class="option px-6 py-3 hover:bg-accent hover:text-dark-bg cursor-pointer transition-colors" data-value="Professional">Professional</div>
                    <div class="option px-6 py-3 hover:bg-accent hover:text-dark-bg cursor-pointer transition-colors" data-value="Casual">Casual</div>
                    <div class="option px-6 py-3 hover:bg-accent hover:text-dark-bg cursor-pointer transition-colors" data-value="Friendly">Friendly</div>
                    <div class="option px-6 py-3 hover:bg-accent hover:text-dark-bg cursor-pointer transition-colors" data-value="Witty">Witty</div>
                </div>
            </div>

            <div class="relative custom-dropdown" id="lang-select">
                <label class="block text-gray-400 text-[11px] font-bold uppercase tracking-widest mb-3">Language</label>
                <input type="hidden" name="language" value="English (US)">
                <div class="dropdown-trigger w-full bg-input-bg border border-border-dark rounded-full py-4 px-6 text-gray-200 flex justify-between items-center cursor-pointer hover:border-gray-500 transition-all">
                    <span class="selected-label">English (US)</span>
                    <i class="fas fa-chevron-down text-[10px] text-gray-500 transition-transform duration-300"></i>
                </div>
                <div class="dropdown-menu absolute z-50 w-full mt-2 bg-[#1e293b] border border-border-dark rounded-2xl overflow-hidden shadow-2xl">
                    <div class="option px-6 py-3 hover:bg-accent hover:text-dark-bg cursor-pointer transition-colors" data-value="English (US)">English (US)</div>
                    <div class="option px-6 py-3 hover:bg-accent hover:text-dark-bg cursor-pointer transition-colors" data-value="Hindi">Hindi</div>
                    <div class="option px-6 py-3 hover:bg-accent hover:text-dark-bg cursor-pointer transition-colors" data-value="Spanish">Spanish</div>
                </div>
            </div>
        </div>
    </div>

    <div class="flex flex-col justify-between">
        <div>
            <label class="block text-gray-400 text-[11px] font-bold uppercase tracking-widest mb-4">Target Platform</label>
            <div class="flex flex-wrap gap-3">
                <label class="group cursor-pointer">
                    <input type="radio" name="platform" value="instagram" class="peer sr-only" checked>
                    <span class="flex items-center gap-2 px-5 py-3 border border-border-dark rounded-full text-gray-500 text-lg font-medium transition-all duration-300 peer-checked:border-accent peer-checked:text-accent peer-checked:shadow-[0_0_15px_rgba(0,207,213,0.2)] group-hover:border-gray-500">
                        <i class="fab fa-instagram text-xl"></i><span>Instagram</span>
                    </span>
                </label>
                <label class="group cursor-pointer">
                    <input type="radio" name="platform" value="linkedin" class="peer sr-only">
                    <span class="flex items-center gap-2 px-5 py-3 border border-border-dark rounded-full text-gray-500 text-lg font-medium transition-all duration-300 peer-checked:border-accent peer-checked:text-accent group-hover:border-gray-500">
                        <i class="fab fa-linkedin text-xl"></i><span>LinkedIn</span>
                    </span>
                </label>
                <label class="group cursor-pointer">
                    <input type="radio" name="platform" value="twitter" class="peer sr-only">
                    <span class="flex items-center gap-2 px-5 py-3 border border-border-dark rounded-full text-gray-500 text-lg font-medium transition-all duration-300 peer-checked:border-accent peer-checked:text-accent group-hover:border-gray-500">
                        <i class="fab fa-x-twitter text-xl"></i><span>X/Twitter</span>
                    </span>
                </label>
                <label class="group cursor-pointer">
                    <input type="radio" name="platform" value="tiktok" class="peer sr-only" checked>
                    <span class="flex items-center gap-2 px-5 py-3 border border-border-dark rounded-full text-gray-500 text-lg font-medium transition-all duration-300 peer-checked:border-accent peer-checked:text-accent peer-checked:shadow-[0_0_15px_rgba(0,207,213,0.2)] group-hover:border-gray-500">
                        <i class="fab fa-tiktok text-xl"></i><span>TikTok</span>
                    </span>
                </label>
                <label class="group cursor-pointer">
                    <input type="radio" name="platform" value="facebook" class="peer sr-only">
                    <span class="flex items-center gap-2 px-5 py-3 border border-border-dark rounded-full text-gray-500 text-lg font-medium transition-all duration-300 peer-checked:border-accent peer-checked:text-accent group-hover:border-gray-500">
                        <i class="fab fa-facebook text-xl"></i><span>Facebook</span>
                    </span>
                </label>
                <label class="group cursor-pointer">
                    <input type="radio" name="platform" value="youtube" class="peer sr-only">
                    <span class="flex items-center gap-2 px-5 py-3 border border-border-dark rounded-full text-gray-500 text-lg font-medium transition-all duration-300 peer-checked:border-accent peer-checked:text-accent group-hover:border-gray-500">
                        <i class="fab fa-youtube text-xl"></i><span>YouTube</span>
                    </span>
                </label>
            </div>
        </div>

        <div class="mt-12">
            <button type="submit" class="w-full bg-accent hover:bg-[#00e1e8] text-dark-bg font-black text-2xl py-5 rounded-[24px] flex items-center justify-center gap-4 transition-all duration-300 shadow-[0_0_20px_rgba(0,207,213,0.3)]">
                <span class="htmx-main-text flex items-center gap-3"><i class="fa-solid fa-wand-magic-sparkles"></i> Generate Captions</span>
                <span class="htmx-indicator flex items-center gap-3"><i class="fas fa-circle-notch animate-spin"></i> Generating...</span>
            </button>
            
            <p class="text-gray-500 text-sm mt-5 text-center tracking-tight">Takes approximately 3-5 seconds to analyze and generate variations.</p>
        </div>
    </div>
</form>
