{% extends "core/base.html" %} 
{% load static %}
{% block title %}Caption AI | {{ block.super }}{% endblock %} 
{% block body_bg %}bg-[#0b1717]{% endblock %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Generation UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'dark-bg': '#12181F',
                        'card-bg': '#131e1e',
                        'input-bg': '#0f172a',
                        'border-dark': '#2A313C',
                        'accent': '#00CFD5',
                        'text-muted': '#94a3b8',
                    },
                }
            }
        }
    </script>
    <style>
        textarea::-webkit-scrollbar { width: 6px; }
        textarea::-webkit-scrollbar-thumb { background: #2A313C; border-radius: 10px; }
        
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: inline-flex; }
        .htmx-request .htmx-main-text { display: none; }

        .dropdown-menu {
            opacity: 0;
            transform: translateY(-8px);
            pointer-events: none;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .dropdown-menu.active {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
    </style>
</head>
<body class="bg-dark-bg min-h-screen p-4 md:p-12 flex flex-col items-center justify-center font-sans text-gray-200">

<div class="bg-card-bg p-8 md:p-10 rounded-[32px] w-full max-w-7xl mx-auto shadow-2xl border border-gray-800 mt-12 mb-12 flex flex-col items-center">
    
    <h1 class="text-3xl font-bold text-center mb-8 text-white">
        Caption Generator
    </h1>

    {% include "caption/partials/form.html" %}

</div>
    
    <div id="result-container" class="w-full max-w-7xl mx-auto"></div>

    <script>
        // Wrapping in DOMContentLoaded ensures the include is fully loaded
        document.addEventListener('DOMContentLoaded', () => {
            // Custom Dropdown Logic
            document.querySelectorAll('.custom-dropdown').forEach(dropdown => {
                const trigger = dropdown.querySelector('.dropdown-trigger');
                const menu = dropdown.querySelector('.dropdown-menu');
                const input = dropdown.querySelector('input[type="hidden"]');
                const label = dropdown.querySelector('.selected-label');
                const icon = trigger.querySelector('i');

                trigger.addEventListener('click', (e) => {
                    e.stopPropagation();
                    document.querySelectorAll('.dropdown-menu').forEach(m => {
                        if(m !== menu) m.classList.remove('active');
                    });
                    menu.classList.toggle('active');
                    icon.classList.toggle('rotate-180');
                });

                menu.querySelectorAll('.option').forEach(option => {
                    option.addEventListener('click', () => {
                        const val = option.getAttribute('data-value');
                        input.value = val;
                        label.innerText = option.innerText;
                        menu.classList.remove('active');
                        icon.classList.remove('rotate-180');
                    });
                });
            });

            window.addEventListener('click', () => {
                document.querySelectorAll('.dropdown-menu').forEach(menu => menu.classList.remove('active'));
                document.querySelectorAll('.dropdown-trigger i').forEach(i => i.classList.remove('rotate-180'));
            });
        });
    </script>
</body>
</html>

{% endblock %}
