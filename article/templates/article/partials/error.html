<div class="w-full h-full min-h-[450px] bg-[#121820]/40 backdrop-blur-xl border-2 border-dashed border-[#ff4d5e]/30 rounded-[24px] p-8 md:p-12 flex flex-col items-center justify-center text-center animate-fade-in group shadow-[0_0_30px_rgba(255,77,94,0.05)]">
    
    <div class="w-20 h-20 bg-[#ff4d5e]/10 rounded-full flex items-center justify-center mb-6 shadow-inner group-hover:scale-110 transition-transform duration-500">
        <i class="fa-solid fa-triangle-exclamation text-3xl text-[#ff4d5e]"></i>
    </div>
    
    <h3 class="text-2xl font-bold text-white mb-4">Generation Failed</h3>
    
    <div class="bg-[#ff4d5e]/10 border border-[#ff4d5e]/20 text-[#ff4d5e] px-6 py-4 rounded-xl text-[15px] max-w-md mx-auto leading-relaxed mb-8">
        {{ error }}
    </div>

    <button type="button" onclick="window.location.reload();" class="px-8 py-3.5 bg-white/5 hover:bg-white/10 border border-white/10 text-white font-semibold rounded-xl transition-all duration-300 hover:-translate-y-0.5 flex items-center gap-2">
        <i class="fa-solid fa-rotate-left"></i> Try Again
    </button>

</div>
