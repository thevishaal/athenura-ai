<style>
    /* --- Premium Dark Glassmorphism Core --- */
    .liquid-glass-panel {
        background: rgba(5, 11, 20, 0.6); /* Slightly more transparent to let the glow shine */
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .liquid-glass-input {
        background: rgba(255, 255, 255, 0.03) !important;
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08) !important;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        color: #ffffff;
    }

    .liquid-glass-input:focus, .custom-dropdown.active .liquid-glass-input {
        border-color: rgba(13, 242, 242, 0.5) !important;
        background: rgba(13, 242, 242, 0.02) !important;
        box-shadow: 0 0 20px rgba(13, 242, 242, 0.15);
        outline: none;
    }

    /* --- Custom Dropdown Styles --- */
    .custom-dropdown { position: relative; }
    .custom-dropdown.active { z-index: 999; }
    
    .dropdown-menu {
        display: none;
        position: absolute;
        top: calc(100% + 10px);
        left: 0;
        right: 0;
        background: rgba(11, 19, 29, 0.98);
        backdrop-filter: blur(30px);
        border: 1px solid rgba(13, 242, 242, 0.3);
        border-radius: 1rem;
        overflow: hidden;
        box-shadow: 0 20px 40px -5px rgba(0, 0, 0, 0.8), 0 0 20px rgba(13, 242, 242, 0.1);
    }
    
    .custom-dropdown.active .dropdown-menu {
        display: block;
        animation: dropdownFadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    .custom-dropdown.active .fa-chevron-down {
        transform: rotate(180deg);
        color: #0df2f2;
    }
    
    @keyframes dropdownFadeIn {
        from { opacity: 0; transform: translateY(-10px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }
    
    .option {
        transition: all 0.2s ease;
        color: #94a3b8; /* text-gray-400 */
    }
    
    .option:hover {
        background: rgba(13, 242, 242, 0.1);
        color: #0df2f2;
        padding-left: 2rem;
        border-left: 3px solid #0df2f2;
    }
    
    /* --- Range Slider Styling --- */
    .theme-slider {
        -webkit-appearance: none;
        appearance: none;
        background: transparent;
    }
    .theme-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 16px;
        width: 16px;
        border-radius: 50%;
        background: #0df2f2;
        cursor: pointer;
        margin-top: -6px; 
        box-shadow: 0 0 15px rgba(13, 242, 242, 0.6);
        transition: transform 0.2s;
    }
    .theme-slider::-webkit-slider-thumb:hover { transform: scale(1.2); }
    .theme-slider::-webkit-slider-runnable-track {
        width: 100%;
        height: 4px;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
    }
    
    /* --- Perfect Button & HTMX Logic --- */
    .htmx-indicator { display: none; }
    .submit-btn { height: 56px; }
    .htmx-request .htmx-main-text { display: none !important; }
    .htmx-request .htmx-indicator { display: flex !important; }
    
    .htmx-request.submit-btn {
        background: linear-gradient(90deg, #0df2f2, #04ffff, #0df2f2);
        background-size: 200% auto;
        animation: gradient-flow 2s linear infinite;
        opacity: 0.9;
        cursor: wait;
        color: #050B14 !important;
    }

    @keyframes gradient-flow {
        0% { background-position: 0% center; }
        100% { background-position: 200% center; }
    }

    @keyframes shimmer-sweep {
        0% { transform: translateX(-150%); }
        100% { transform: translateX(150%); }
    }
    .animate-shimmer-sweep {
        animation: shimmer-sweep 1.5s ease-in-out infinite;
    }

    /* --- Form Animations --- */
    .form-group { animation: fadeInUp 0.5s ease-out backwards; }
    .delay-100 { animation-delay: 100ms; }
    .delay-200 { animation-delay: 200ms; }
    .delay-300 { animation-delay: 300ms; }
    .delay-400 { animation-delay: 400ms; }
    .delay-500 { animation-delay: 500ms; }
    
    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(15px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>

<form
    method="POST"
    hx-post="{% url 'blog' %}"
    hx-target="#blog-output"
    hx-swap="innerHTML"
    hx-disabled-elt="button"
    id="blog-form"
    class="flex flex-col gap-6 liquid-glass-panel p-6 sm:p-8 rounded-[24px] relative overflow-hidden w-full min-w-[300px] md:min-w-[450px]">
    
    {% csrf_token %}

    <div class="absolute inset-0 pointer-events-none z-0">
        <div class="absolute -top-[15%] -left-[15%] w-[70%] h-[70%] bg-[#0df2f2]/10 rounded-full blur-[80px] animate-pulse duration-1000"></div>
        <div class="absolute -bottom-[15%] -right-[15%] w-[70%] h-[70%] bg-purple-500/10 rounded-full blur-[80px] animate-pulse duration-1000" style="animation-delay: 2s;"></div>
    </div>

    <div class="form-group relative" style="z-index: 60;">
        <label class="block text-[#0df2f2] text-[11px] font-bold uppercase tracking-[0.2em] mb-3 ml-2">Blog Topic</label>
        <textarea 
            name="topic" 
            class="liquid-glass-input w-full h-32 rounded-2xl p-5 text-sm placeholder-gray-500 resize-none"
            placeholder="e.g. The Future of Quantum Computing and Neural Networks..."
            required
        >{{ form.topic.value|default:'' }}</textarea>
    </div>

    <div class="grid grid-cols-2 w-full gap-4 form-group delay-100 relative" style="z-index: 50;">
        <div class="custom-dropdown w-full" id="tone-select">
            <label class="block text-[#0df2f2] text-[11px] font-bold uppercase tracking-[0.2em] mb-3 ml-2">Tone</label>
            <input type="hidden" name="tone" id="tone-input" value="Professional">
            <div class="dropdown-trigger liquid-glass-input w-full rounded-2xl py-4 px-5 flex justify-between items-center cursor-pointer gap-3">
                <span class="selected-label text-sm flex-1 text-left truncate">Professional</span>
                <i class="fas fa-chevron-down text-[12px] text-gray-500 transition-transform duration-300 shrink-0"></i>
            </div>
            <div class="dropdown-menu">
                <div class="option px-5 py-3.5 cursor-pointer text-sm" data-value="Professional">Professional</div>
                <div class="option px-5 py-3.5 cursor-pointer text-sm" data-value="Casual">Casual</div>
                <div class="option px-5 py-3.5 cursor-pointer text-sm" data-value="Witty">Witty</div>
                <div class="option px-5 py-3.5 cursor-pointer text-sm" data-value="Inspirational">Inspirational</div>
                <div class="option px-5 py-3.5 cursor-pointer text-sm" data-value="Storytelling">Storytelling</div>
            </div>
        </div>

        <div class="custom-dropdown w-full" id="style-select">
            <label class="block text-[#0df2f2] text-[11px] font-bold uppercase tracking-[0.2em] mb-3 ml-2">Style</label>
            <input type="hidden" name="style" id="style-input" value="Storytelling">
            <div class="dropdown-trigger liquid-glass-input w-full py-4 px-5 flex justify-between items-center cursor-pointer rounded-2xl gap-3">
                <span class="selected-label text-sm flex-1 text-left truncate">Storytelling</span>
                <i class="fas fa-chevron-down text-[12px] text-gray-500 transition-transform duration-300 shrink-0"></i>
            </div>
            <div class="dropdown-menu">
                <div class="option px-5 py-3.5 cursor-pointer text-sm" data-value="Storytelling">Storytelling</div>
                <div class="option px-5 py-3.5 cursor-pointer text-sm" data-value="Journalistic">Journalistic</div>
                <div class="option px-5 py-3.5 cursor-pointer text-sm" data-value="Listicle">Listicle</div>
                <div class="option px-5 py-3.5 cursor-pointer text-sm" data-value="Educational">Educational</div>
                <div class="option px-5 py-3.5 cursor-pointer text-sm" data-value="Analytical">Analytical</div>
            </div>
        </div>
    </div>

    <div class="form-group delay-200 relative" style="z-index: 40;">
        <div class="custom-dropdown w-full" id="language-select">
            <label class="block text-[#0df2f2] text-[11px] font-bold uppercase tracking-[0.2em] mb-3 ml-2">Language</label>
            <input type="hidden" name="language" id="language-input" value="English (US)">
            <div class="dropdown-trigger liquid-glass-input w-full py-4 px-5 flex justify-between items-center cursor-pointer rounded-2xl gap-3">
                <span class="selected-label text-sm flex-1 text-left truncate">English (US)</span>
                <i class="fas fa-chevron-down text-[12px] text-gray-500 transition-transform duration-300 shrink-0"></i>
            </div>
            <div class="dropdown-menu">
                <div class="option px-5 py-3.5 cursor-pointer text-sm" data-value="English (US)">English (US)</div>
                <div class="option px-5 py-3.5 cursor-pointer text-sm" data-value="English (UK)">English (UK)</div>
                <div class="option px-5 py-3.5 cursor-pointer text-sm" data-value="Hinglish">Hinglish</div>
                <div class="option px-5 py-3.5 cursor-pointer text-sm" data-value="Hindi">Hindi</div>
                <div class="option px-5 py-3.5 cursor-pointer text-sm" data-value="French">French</div>
                <div class="option px-5 py-3.5 cursor-pointer text-sm" data-value="Spanish">Spanish</div>
            </div>
        </div>
    </div>

    <div class="form-group delay-300 relative" style="z-index: 30;">
        <div class="flex justify-between items-end mb-3 ml-2 mr-2">
            <label class="block text-[#0df2f2] text-[11px] font-bold uppercase tracking-[0.2em]">Word Count</label>
            <span id="wordCountDisplay" class="text-[#0df2f2] text-[11px] font-mono font-bold bg-[#0df2f2]/10 border border-[#0df2f2]/20 px-3 py-1.5 rounded-lg shadow-[0_0_10px_rgba(13,242,242,0.1)]">1,200 words</span>
        </div>
        <input
            type="range"
            name="word_count"
            id="wordCountSlider"
            min="100"
            max="3000"
            step="100"
            value="1200"
            class="theme-slider w-full h-1 mt-2 focus:outline-none"
        />
    </div>

    <div class="form-group delay-400 relative" style="z-index: 20;">
        <label class="block text-[#0df2f2] text-[11px] font-bold uppercase tracking-[0.2em] mb-3 ml-2">External Thoughts / Context</label>
        <textarea
            name="external_thoughts"
            rows="3"
            placeholder="Mention the recent market shifts and their impact..."
            class="liquid-glass-input w-full rounded-2xl px-5 py-4 text-sm placeholder-gray-500 resize-none"
        ></textarea>
    </div>

    <input type="hidden" name="audience" value="General" />

    <div class="mt-4 form-group delay-500 relative" style="z-index: 10;">
        <button
            type="submit"
            id="generate-btn"
            class="submit-btn relative w-full overflow-hidden bg-[#0df2f2] text-[#050B14] font-black text-[13px] tracking-[0.2em] uppercase rounded-2xl flex items-center justify-center transition-all duration-300 shadow-[0_0_15px_rgba(13,242,242,0.3)] hover:shadow-[0_0_30px_rgba(13,242,242,0.5)] disabled:opacity-70 disabled:cursor-not-allowed group p-4"
        >
            <span class="htmx-main-text flex items-center justify-center gap-3 w-full h-full relative z-10">
                <span id="btn-text">GENERATE CONTENT</span>
                <svg class="w-4 h-4 transition-transform duration-300 group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
            </span>

            <span class="htmx-indicator flex items-center justify-center gap-3 w-full h-full text-[#050B14] font-black relative z-10">
                <div class="absolute inset-0 w-full h-full bg-gradient-to-r from-transparent via-white/50 to-transparent animate-shimmer-sweep pointer-events-none z-0"></div>
                <div class="flex items-center justify-center gap-3 relative z-10">
                    <svg class="animate-spin h-5 w-5 text-[#050B14]" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    SYNTHESIZING...
                </div>
            </span>
        </button>
    </div>
</form>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        
        // --- Dropdown Initialization Helper ---
        function initDropdown(dropdownId, inputId) {
            const dropdown = document.getElementById(dropdownId);
            if (!dropdown) return;
            
            const trigger = dropdown.querySelector('.dropdown-trigger');
            const menu = dropdown.querySelector('.dropdown-menu');
            const selectedLabel = trigger.querySelector('.selected-label');
            const hiddenInput = document.getElementById(inputId);
            
            trigger.addEventListener('click', function(e) {
                e.stopPropagation();
                // Close others first
                document.querySelectorAll('.custom-dropdown').forEach(d => {
                    if (d !== dropdown) d.classList.remove('active');
                });
                dropdown.classList.toggle('active');
            });
            
            menu.querySelectorAll('.option').forEach(option => {
                option.addEventListener('click', function() {
                    selectedLabel.textContent = this.textContent;
                    if (hiddenInput) hiddenInput.value = this.getAttribute('data-value');
                    dropdown.classList.remove('active');
                });
            });
        }
        
        // Close dropdowns if clicking anywhere else on the page
        document.addEventListener('click', () => {
            document.querySelectorAll('.custom-dropdown').forEach(dropdown => {
                dropdown.classList.remove('active');
            });
        });
        
        initDropdown('tone-select', 'tone-input');
        initDropdown('style-select', 'style-input');
        initDropdown('language-select', 'language-input');
        
        // --- Range Slider Logic ---
        const slider = document.getElementById("wordCountSlider");
        const display = document.getElementById("wordCountDisplay");
        const accentColor = "#0df2f2"; 
        const trackColor = "rgba(255, 255, 255, 0.1)";

        function updateSlider() {
            display.textContent = `${Number(slider.value).toLocaleString()} words`;
            const percentage = ((slider.value - slider.min) / (slider.max - slider.min)) * 100;
            slider.style.background = `linear-gradient(to right, ${accentColor} 0%, ${accentColor} ${percentage}%, ${trackColor} ${percentage}%, ${trackColor} 100%)`;
        }

        updateSlider();
        slider.addEventListener("input", updateSlider);
    });

    // Listen for HTMX to finish its request successfully
    document.body.addEventListener('htmx:afterOnLoad', function(event) {
        if(event.detail.successful) {
            const btnText = document.getElementById('btn-text');
            if(btnText) {
                btnText.innerText = 'GENERATED SUCCESSFULLY';
                setTimeout(() => {
                    btnText.innerText = 'GENERATE CONTENT';
                }, 3000);
            }
        }
    });
</script>
