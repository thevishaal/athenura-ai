{% load static %}

<nav class="w-full flex items-center justify-between py-5 px-6 sm:px-8 border-b border-white/5 relative z-50 {% if request.resolver_match.url_name == 'caption' %}bg-footer{% else %}bg-transparent{% endif %}">
    
    <a href="{% url 'dashboard' %}" class="flex items-center gap-2 transition-transform hover:scale-105">
        <img src="{% static 'core/images/White.png' %}" alt="Athenura Logo" class="h-9 sm:h-11 w-auto drop-shadow-lg" onerror="this.style.display='none'">
    </a>

    <div class="flex items-center gap-6 md:gap-8">
        
        {% if user.is_authenticated %}
           <ul class="hidden lg:flex items-center gap-8 text-sm font-medium tracking-wide">
    
    <li>
        <a href="{% url 'blog' %}" 
           class="transition-all duration-300 hover:drop-shadow-[0_0_8px_rgba(0,229,255,0.4)] hover:text-accent 
           {% if request.resolver_match.url_name == 'blog' %} text-accent drop-shadow-[0_0_8px_rgba(0,229,255,0.4)] {% else %} text-text-muted {% endif %}">
           Blog Generator
        </a>
    </li>

    <li>
        <a href="{% url 'caption' %}" 
           class="transition-all duration-300 hover:drop-shadow-[0_0_8px_rgba(0,229,255,0.4)] hover:text-accent 
           {% if request.resolver_match.url_name == 'caption' %} text-accent drop-shadow-[0_0_8px_rgba(0,229,255,0.4)] {% else %} text-text-muted {% endif %}">
           Caption AI
        </a>
    </li>

    <li>
        <a href="{% url 'article' %}" 
           class="transition-all duration-300 hover:drop-shadow-[0_0_8px_rgba(0,229,255,0.4)] hover:text-accent 
           {% if request.resolver_match.url_name == 'article' %} text-accent drop-shadow-[0_0_8px_rgba(0,229,255,0.4)] {% else %} text-text-muted {% endif %}">
           Article Generator
        </a>
    </li>

    <li>
        <a href="{% url 'social_media' %}" 
           class="transition-all duration-300 hover:drop-shadow-[0_0_8px_rgba(0,229,255,0.4)] hover:text-accent 
           {% if request.resolver_match.url_name == 'social_media' %} text-accent drop-shadow-[0_0_8px_rgba(0,229,255,0.4)] {% else %} text-text-muted {% endif %}">
           Social Ideas
        </a>
    </li>

    <li>
        <a href="{% url 'dashboard' %}" 
           class="transition-all duration-300 hover:drop-shadow-[0_0_8px_rgba(0,229,255,0.4)] hover:text-accent 
           {% if request.resolver_match.url_name == 'dashboard' %} text-accent drop-shadow-[0_0_8px_rgba(0,229,255,0.4)] {% else %} text-text-muted {% endif %}">
           Dashboard
        </a>
    </li>
</ul>

            <div class="hidden lg:block h-6 w-px bg-white/10"></div>

            <div class="relative">
                <button id="profile-btn" class="flex items-center gap-3 focus:outline-none hover:opacity-80 transition-opacity group">
                    
                    <span class="hidden md:block text-sm font-medium text-gray-200 group-hover:text-white transition-colors">
                        Welcome, {{ user.full_name|default:"User" }}
                    </span>
                    
                    <div class="relative">
                        <div class="w-10 h-10 rounded-full bg-[#131A26] border border-white/10 flex items-center justify-center text-accent font-bold uppercase shadow-[0_0_15px_rgba(0,229,255,0.15)] group-hover:shadow-[0_0_20px_rgba(0,229,255,0.3)] transition-all duration-300">
                            {{ user.full_name|make_list|first|default:"U" }}
                        </div>
                        
                        <span class="absolute bottom-0 right-0 w-3 h-3 bg-[#27C93F] border-2 border-[#0A0F16] rounded-full"></span>
                    </div>
                </button>

                <div id="profile-dropdown" class="absolute right-0 mt-4 w-48 rounded-2xl shadow-2xl py-2 bg-[#131A26]/90 backdrop-blur-xl border border-white/10 hidden z-50 transition-all duration-300 transform origin-top-right">
                    
                    <div class="px-4 py-3 border-b border-white/10 md:hidden">
                        <p class="text-sm text-white font-medium truncate">Welcome, {{ user.username|default:"User" }}</p>
                    </div>

                    <a href="{% url 'change_password' %}" class="block px-4 py-2.5 text-sm text-gray-300 hover:bg-white/5 hover:text-accent transition-colors flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path></svg>
                        Change Password
                    </a>
                    
                    <a href="{% url 'logout' %}" class="block px-4 py-2.5 text-sm text-[#FF5F56] hover:bg-[#FF5F56]/10 transition-colors flex items-center gap-2 mt-1 rounded-b-xl">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                        Logout
                    </a>
                </div>
            </div>

        {% else %}
            <ul class="flex items-center gap-5 text-sm font-medium">
                <li><a href="{% url 'signin_view' %}" class="text-gray-300 hover:text-white transition-colors">Sign In</a></li>
                <li><a href="{% url 'signup_view' %}" class="bg-accent text-dark-bg px-6 py-2.5 rounded-btn font-bold hover:bg-accent-hover transition-all duration-300 shadow-[0_0_15px_rgba(0,229,255,0.3)] hover:shadow-[0_0_20px_rgba(0,229,255,0.5)] transform hover:scale-105">Sign Up</a></li>
            </ul>
        {% endif %}

    </div>
</nav>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const profileBtn = document.getElementById('profile-btn');
        const profileDropdown = document.getElementById('profile-dropdown');

        if (profileBtn && profileDropdown) {
            // Click karne par dropdown toggle karein
            profileBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                profileDropdown.classList.toggle('hidden');
            });

            // Bahar click karne par dropdown band ho jaye
            document.addEventListener('click', function(e) {
                if (!profileBtn.contains(e.target) && !profileDropdown.contains(e.target)) {
                    profileDropdown.classList.add('hidden');
                }
            });
        }
    });
</script>
