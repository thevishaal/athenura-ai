{% extends "core/base.html" %}
{% load static %}
{% block title %}Invalid Link | {{block.super}}{% endblock %}

{% block content %}
<style>
    /* --- Liquid Mesh Gradient Animations --- */
    @keyframes blob1 {
        0% { transform: translate(0%, 0%) scale(1); }
        33% { transform: translate(15%, 25%) scale(1.1); }
        66% { transform: translate(-10%, 15%) scale(0.9); }
        100% { transform: translate(0%, 0%) scale(1); }
    }
    @keyframes blob2 {
        0% { transform: translate(0%, 0%) scale(1); }
        33% { transform: translate(-15%, -25%) scale(1.1); }
        66% { transform: translate(10%, -15%) scale(0.9); }
        100% { transform: translate(0%, 0%) scale(1); }
    }
    @keyframes blob3 {
        0% { transform: translate(0%, 0%) scale(1); }
        33% { transform: translate(15%, -15%) scale(1.1); }
        66% { transform: translate(-15%, 15%) scale(0.9); }
        100% { transform: translate(0%, 0%) scale(1); }
    }

    .mesh-blob-1 { animation: blob1 18s infinite ease-in-out; }
    .mesh-blob-2 { animation: blob2 22s infinite ease-in-out; }
    .mesh-blob-3 { animation: blob3 25s infinite ease-in-out; }
</style>

<div class="min-h-[85vh] w-full flex items-center justify-center px-4 sm:px-6 py-12 relative overflow-hidden animate-fade-in">

    <div class="absolute inset-0 bg-[#0b121c]/40 backdrop-blur-[40px] pointer-events-none z-0"></div>

    <div class="w-full max-w-md  backdrop-blur-2xl border border-white/10 rounded-[2.5rem]  p-8 sm:p-12 relative z-10 bg-white/[0.03] shadow-[inset_1px_0_0_rgba(255,255,255,0.05)] text-center">

        <div class="w-20 h-20 mx-auto bg-[#ff4d5e]/10 rounded-full flex items-center justify-center mb-8 border border-[#ff4d5e]/30 shadow-[0_0_30px_rgba(255,77,94,0.15)]">
            <i class="fa-solid fa-circle-exclamation text-3xl text-[#ff4d5e]"></i>
        </div>

        <div class="mb-10">
            <h2 class="text-3xl font-black text-white mb-4 tracking-tight">Invalid Link</h2>
            <p class="text-gray-400 text-sm leading-relaxed">
                Oops! The reset link you followed is either invalid or has already expired for security reasons.
            </p>
        </div>

        <div class="pt-2">
            <a href="{% url 'forgot_password' %}" class="w-full h-[56px] bg-[#0df2f2] hover:bg-[#0cf2f2] text-[#0b121c] font-bold text-[15px] tracking-[0.1em] uppercase rounded-full flex items-center justify-center transition-all duration-300 shadow-[0_0_15px_rgba(13,242,242,0.3)] hover:shadow-[0_0_25px_rgba(13,242,242,0.5)] hover:-translate-y-0.5 group">
                Try Again
                <i class="fa-solid fa-rotate-right ml-2 opacity-70 group-hover:rotate-180 transition-transform duration-500"></i>
            </a>
        </div>

        <div class="text-center mt-8">
            <a href="{% url 'signin_view' %}" class="text-gray-500 text-sm font-medium hover:text-white transition-colors">
                Back to Sign In
            </a>
        </div>

    </div>
</div>
{% endblock %}
