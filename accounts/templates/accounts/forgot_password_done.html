{% extends "core/base.html" %}
{% load static %}
{% block title %}Reset Email Sent | {{block.super}}{% endblock %}

{% block content %}
<style>
    /* --- Liquid Mesh Gradient Animations --- */
    @keyframes blob1 {
        0% { transform: translate(0%, 0%) scale(1); }
        33% { transform: translate(15%, 25%) scale(1.1); }
        66% { transform: translate(-10%, 15%) scale(0.9); }
        100% { transform: translate(0%, 0%) scale(1); }
    }
    @keyframes blob2 {
        0% { transform: translate(0%, 0%) scale(1); }
        33% { transform: translate(-15%, -25%) scale(1.1); }
        66% { transform: translate(10%, -15%) scale(0.9); }
        100% { transform: translate(0%, 0%) scale(1); }
    }
    @keyframes blob3 {
        0% { transform: translate(0%, 0%) scale(1); }
        33% { transform: translate(15%, -15%) scale(1.1); }
        66% { transform: translate(-15%, 15%) scale(0.9); }
        100% { transform: translate(0%, 0%) scale(1); }
    }

    .mesh-blob-1 { animation: blob1 18s infinite ease-in-out; }
    .mesh-blob-2 { animation: blob2 22s infinite ease-in-out; }
    .mesh-blob-3 { animation: blob3 25s infinite ease-in-out; }
</style>

<div class="min-h-[85vh] w-full flex items-center justify-center px-4 sm:px-6 py-12 relative overflow-hidden animate-fade-in">

    <div class="absolute inset-0 bg-[#0b121c]/20 backdrop-blur-[40px] pointer-events-none z-0"></div>

    <div class="w-full max-w-md  backdrop-blur-2xl border border-white/10 rounded-[2.5rem] s p-8 sm:p-12 relative z-10 bg-white/[0.03] shadow-[inset_1px_0_0_rgba(255,255,255,0.05)] text-center">

        <div class="w-20 h-20 mx-auto bg-[#0df2f2]/10 rounded-full flex items-center justify-center mb-8 border border-[#0df2f2]/30 shadow-[0_0_30px_rgba(13,242,242,0.15)] relative">
            <div class="absolute inset-0 rounded-full bg-[#0df2f2]/20 animate-ping opacity-20"></div>
            <i class="fa-solid fa-paper-plane text-3xl text-[#0df2f2] ml-[-2px] mt-[2px]"></i>
        </div>

        <div class="mb-10">
            <h2 class="text-3xl font-black text-white mb-4 tracking-tight">Check Your Inbox!</h2>
            <p class="text-gray-400 text-sm leading-relaxed">
                If your email exists in our system, a password reset link has been sent. Please check your inbox and spam folder.
            </p>
        </div>

        <div class="pt-2">
            <a href="{% url 'signin_view' %}" class="w-full h-[56px] bg-[#0df2f2] hover:bg-[#0cf2f2] text-[#0b121c] font-bold text-[15px] tracking-[0.1em] uppercase rounded-full flex items-center justify-center transition-all duration-300 shadow-[0_0_15px_rgba(13,242,242,0.3)] hover:shadow-[0_0_25px_rgba(13,242,242,0.5)] hover:-translate-y-0.5 group">
                Back to Login
                <i class="fa-solid fa-arrow-right ml-2 opacity-70 group-hover:translate-x-1 transition-transform"></i>
            </a>
        </div>

    </div>
</div>
{% endblock %}
