{% extends "core/base.html" %}
{% load static %}
{% block title %}Forgot Password | {{block.super}}{% endblock %}

{% block content %}

<style>
    html, body {
        height: 100%;
        overflow: hidden; 
        background: #161717; 
    }

    @keyframes blob1 {
        0% { transform: translate(0%, 0%) scale(1); }
        33% { transform: translate(15%, 25%) scale(1.1); }
        66% { transform: translate(-10%, 15%) scale(0.9); }
        100% { transform: translate(0%, 0%) scale(1); }
    }
    @keyframes blob2 {
        0% { transform: translate(0%, 0%) scale(1); }
        33% { transform: translate(-15%, -25%) scale(1.1); }
        66% { transform: translate(10%, -15%) scale(0.9); }
        100% { transform: translate(0%, 0%) scale(1); }
    }
    @keyframes blob3 {
        0% { transform: translate(0%, 0%) scale(1); }
        33% { transform: translate(15%, -15%) scale(1.1); }
        66% { transform: translate(-15%, 15%) scale(0.9); }
        100% { transform: translate(0%, 0%) scale(1); }
    }

    .mesh-blob-1 { animation: blob1 18s infinite ease-in-out; }
    .mesh-blob-2 { animation: blob2 22s infinite ease-in-out; }
    .mesh-blob-3 { animation: blob3 25s infinite ease-in-out; }
</style>

<div class="h-screen w-full flex items-center justify-center px-4  overflow-hidden ">
  

    <!-- CARD -->
    <div class="w-full max-w-md bg-[#151515]/90 backdrop-blur-2xl border border-white/10 rounded-[2rem] shadow-2xl p-8 relative z-10">

        <div class="text-center mb-8">
            <h2 class="text-3xl font-black text-white mb-2">Forgot Password</h2>
            <p class="text-gray-400 text-sm">Enter your email to receive reset link</p>
        </div>

        <form method="POST" class="space-y-6">
            {% csrf_token %}

            <div>
                <label class="block text-gray-400 text-[10px] uppercase tracking-widest mb-2 ml-1">
                    Email Address
                </label>
                <input 
                    type="email" 
                    name="email"
                    class="w-full bg-black/20 border border-white/10 rounded-xl p-4 text-white placeholder-gray-500 focus:outline-none focus:border-[#0df2f2] focus:bg-[#0df2f2]/5 transition-all"
                    placeholder="you@example.com"
                    required
                >
            </div>

            <button type="submit"
                class="w-full h-[50px] bg-[#0df2f2] hover:bg-[#0cf2f2] text-[#0b121c] font-bold text-sm uppercase tracking-wider rounded-full transition-all shadow-[0_0_15px_rgba(13,242,242,0.3)] hover:shadow-[0_0_25px_rgba(13,242,242,0.5)]">
                Send Reset Link
            </button>
        </form>

        <div class="text-center mt-6">
            <a href="{% url 'signin_view' %}" class="text-[#0df2f2] text-sm hover:text-white transition">
                ← Back to Login
            </a>
        </div>

    </div>
</div>

{% endblock %}
